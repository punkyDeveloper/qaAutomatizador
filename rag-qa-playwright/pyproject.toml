[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-qa-playwright"
version = "1.0.0"
description = "RAG de calidad de software para pruebas Playwright + POM, conectado a GitHub Copilot por MCP"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5,<2",
    "sentence-transformers>=5,<7",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rag-qa = "rag_qa.cli:main"
rag-qa-servidor = "rag_qa.servidor_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "modelo: pruebas que usan el modelo real de embeddings (se omiten si no está descargado)",
]
filterwarnings = ["ignore::DeprecationWarning"]
