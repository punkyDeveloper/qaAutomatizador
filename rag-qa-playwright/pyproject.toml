[build-system]
# 84.1: corrige GHSA-xmj3-9gf7-h52w (escritura fuera de carpeta al instalar en Windows).
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-qa-playwright"
version = "1.0.0"
description = "RAG de calidad de software para pruebas Playwright + POM, conectado a GitHub Copilot por MCP"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5,<2",
    "sentence-transformers>=5,<7",
    "mcp>=2.2,<3",
    # Pisos de seguridad para dependencias indirectas (resultado de pip-audit, 2026-11-24).
    # No se usan directamente: solo obligan a instalar una versión sin la vulnerabilidad.
    "certifi>=2026.10.18",          # PYSEC-2026-4320: certificado raíz comprometido
    "filelock>=4.2.1",              # CVE-2026-112906 y relacionados
    "oauthlib>=4.0.1",              # CVE-2026-49272
    "opentelemetry-api>=1.45.2",    # CVE-2026-126360 (ReDoS)
    "setuptools>=84.1",             # GHSA-xmj3-9gf7-h52w (torch la necesita en el venv)
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rag-qa = "rag_qa.cli:main"
rag-qa-servidor = "rag_qa.servidor_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "modelo: pruebas que usan el modelo real de embeddings (se omiten si no está descargado)",
]
filterwarnings = ["ignore::DeprecationWarning"]
